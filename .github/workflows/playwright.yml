name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://localhost:4321
      API_BASE_URL: http://localhost:4000
      ADMIN_EMAIL: admin@qaupskill.local
      ADMIN_PASSWORD: Admin123!
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:4321
      QA_UPSKILL_ADMIN_EMAIL: admin@qaupskill.local
      QA_UPSKILL_ADMIN_PASSWORD: Admin123!
      PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Playwright
        run: npm run check:playwright

      - name: Lint Playwright
        run: npm run lint:playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral JWT secret
        shell: bash
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          printf 'JWT_SECRET=%s\n' "$jwt_secret" >> "$GITHUB_ENV"

      - name: Start services and run Playwright tests
        shell: bash
        run: |
          set -Eeuo pipefail

          app_log="$RUNNER_TEMP/qaupskill-dev.log"
          setsid npm run dev >"$app_log" 2>&1 &
          app_pid=$!

          cleanup() {
            status=$?
            trap - EXIT

            if [ "$status" -ne 0 ]; then
              echo "::group::Application logs"
              if [ -f "$app_log" ]; then
                cat "$app_log"
              fi
              echo "::endgroup::"
            fi

            kill -- "-$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          api_health="$(
            curl --fail --silent --show-error \
              --retry 30 \
              --retry-delay 1 \
              --retry-all-errors \
              --retry-max-time 60 \
              --connect-timeout 2 \
              --max-time 5 \
              http://localhost:4000/health
          )"

          if [ "$api_health" != '{"status":"ok"}' ]; then
            echo "API health check returned an unexpected response body."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 30 \
            --retry-delay 1 \
            --retry-all-errors \
            --retry-max-time 60 \
            --connect-timeout 2 \
            --max-time 5 \
            --output /dev/null \
            http://localhost:4321/

          npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
